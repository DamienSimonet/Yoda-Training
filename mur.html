<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perdus en mer — écran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root{
  --paper:#EFF3F4; --surface:#FFFFFF; --surface-2:#F6F9FA;
  --ink:#0B2130; --ink-2:#3D5D71; --ink-3:#6E8A9B;
  --line:#CCD9DF; --line-soft:#E1EAEE;
  --accent:#C74E1C; --accent-ink:#A03D13; --accent-soft:#FAEDE6;
  --sea:#136E77; --sea-soft:#E2F0F1; --warn:#B03A2B;
  --shadow:0 1px 2px rgba(11,33,48,.06), 0 8px 24px -16px rgba(11,33,48,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#08161E; --surface:#0F2632; --surface-2:#13303E;
    --ink:#E4EDF1; --ink-2:#9DB6C3; --ink-3:#71909F;
    --line:#25404F; --line-soft:#1B3543;
    --accent:#EE7B41; --accent-ink:#F5945F; --accent-soft:#33201A;
    --sea:#57B6BC; --sea-soft:#12333A; --warn:#E0705C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#08161E; --surface:#0F2632; --surface-2:#13303E;
  --ink:#E4EDF1; --ink-2:#9DB6C3; --ink-3:#71909F;
  --line:#25404F; --line-soft:#1B3543;
  --accent:#EE7B41; --accent-ink:#F5945F; --accent-soft:#33201A;
  --sea:#57B6BC; --sea-soft:#12333A; --warn:#E0705C;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
.hidden{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 72px}

.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-bottom:13px;border-bottom:2px solid var(--ink);margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin:0 0 4px}
.masthead h1{font-weight:700;font-size:clamp(24px,5vw,36px);letter-spacing:-.02em;margin:0;line-height:1.05}
.masthead .coords{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-variant-numeric:tabular-nums;text-align:right}

h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
h3{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
p{margin:0 0 12px;max-width:64ch}
.muted{color:var(--ink-3);font-size:13px}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;box-shadow:var(--shadow)}
.brief{font-family:Newsreader,Georgia,serif;font-size:16px;line-height:1.65;color:var(--ink-2);
  border-left:3px solid var(--accent);padding:2px 0 2px 18px}
.brief p:last-child{margin-bottom:0}
.brief strong{color:var(--ink);font-weight:500}

button{font-family:inherit;touch-action:manipulation}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-size:14px;font-weight:600;padding:11px 20px;border-radius:3px;cursor:pointer;
  transition:transform .08s ease,opacity .15s ease}
.btn:hover{opacity:.88}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.small{padding:7px 13px;font-size:13px}
.btn.big{padding:14px 26px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}

label.field{display:block;margin-bottom:14px}
label.field .lab{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
input[type=text],select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:11px 12px}
input.code{font-variant-numeric:tabular-nums;letter-spacing:.22em;text-transform:uppercase;font-weight:700;font-size:19px}
.fieldrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 16px}

.sorter{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;touch-action:pan-y}
.row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:9px 8px 9px 0;user-select:none}
.row.drag{border-color:var(--accent);box-shadow:0 10px 22px -12px rgba(11,33,48,.45);background:var(--surface-2)}
.row .rank{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;text-align:center;
  color:var(--ink-3);border-right:1px solid var(--line-soft);padding:2px 0;line-height:1.2}
.row.top .rank{color:var(--accent)}
.row .name{font-size:14.5px;line-height:1.35;cursor:grab;touch-action:none}
.row .ctrl{display:flex;gap:4px}
.row .ctrl button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);border-radius:3px;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
.row .ctrl button:disabled{opacity:.3;cursor:default}
.hint{font-size:12.5px;color:var(--ink-3);margin:10px 0 0}

.status{font-size:13.5px;padding:10px 14px;border-radius:3px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);margin-bottom:14px}
.status.ok{border-color:var(--sea);background:var(--sea-soft);color:var(--sea)}
.status.err{border-color:var(--warn);background:var(--accent-soft);color:var(--warn)}
.live{font-size:12.5px;color:var(--sea);min-height:1.4em;margin:8px 0 0}

.sent{background:var(--sea-soft);border:1px solid var(--sea);border-radius:4px;padding:24px;text-align:center}
.sent .big{font-size:21px;font-weight:700;color:var(--sea);margin-bottom:6px}
.sent .sub{font-size:14px;color:var(--ink-2)}

.people{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 6px;padding:0;list-style:none}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;
  padding:5px 13px;font-size:13.5px;font-weight:500}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tile{background:var(--surface);padding:16px}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.tile.hero{background:var(--sea-soft)}
.tile.hero .v,.tile.hero .k{color:var(--sea)}
.tile.miss{background:var(--accent-soft)}
.tile.miss .v,.tile.miss .k{color:var(--accent-ink)}
.verdict{margin-top:14px;padding:15px 18px;border-radius:4px;border:1px solid var(--line);
  background:var(--sea-soft);font-family:Newsreader,Georgia,serif;font-size:16.5px;line-height:1.55;color:var(--ink)}
.verdict.miss{background:var(--accent-soft)}

.tablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
td.obj{white-space:normal;min-width:210px}
tbody tr td{background:var(--surface)}
tbody tr:nth-child(even) td{background:var(--surface-2)}
td.off{font-weight:700;color:var(--accent)}
td.coll{font-weight:700;color:var(--sea)}
.gap2{color:var(--warn);font-weight:700}
.gap0{color:var(--ink-3)}
details{border-top:1px solid var(--line-soft);padding-top:14px;margin-top:18px}
summary{cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.just{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
.just .r{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);min-width:26px}
.just .o{font-weight:600;min-width:200px}
.just .w{color:var(--ink-2);font-size:13.5px;line-height:1.5;max-width:52ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

body{background:#0B2130;color:#EAF1F4}
.projwrap{max-width:1800px;margin:0 auto;padding:24px 34px 34px}
.projhead{display:flex;align-items:center;justify-content:space-between;gap:28px;
  border-bottom:1px solid rgba(234,241,244,.22);padding-bottom:16px;margin-bottom:24px}
.projhead h1{margin:0;font-size:clamp(26px,3.2vw,44px);font-weight:700;letter-spacing:-.02em;color:#fff}
.projhead .eyebrow{color:#EE9C6E;margin-bottom:6px}
.phasetag{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#A8C0CC;margin-top:8px}
.joinbox{display:flex;align-items:center;gap:18px;background:#fff;border-radius:6px;padding:14px 18px;color:#0B2130}
.joinbox .qr{width:130px;height:130px}
.joinbox .qr svg{width:100%;height:100%;display:block}
.joinbox .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#3D5D71}
.joinbox .code{font-size:40px;font-weight:700;letter-spacing:.18em;line-height:1.1;font-variant-numeric:tabular-nums}
.joinbox .url{font-size:12.5px;color:#3D5D71;margin-top:2px}
.joinbox.small .qr{width:78px;height:78px}
.joinbox.small .code{font-size:26px}

.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.teamcard{background:rgba(255,255,255,.06);border:1px solid rgba(234,241,244,.18);
  border-radius:6px;padding:22px;min-height:270px}
.teamcard h3{color:#EE9C6E;font-size:15px;letter-spacing:.14em;margin:0 0 14px}
.teamcard .count{font-size:15px;color:#A8C0CC;margin-bottom:14px;font-variant-numeric:tabular-nums}
.wchip{display:inline-block;border:1px solid rgba(234,241,244,.28);background:rgba(255,255,255,.08);
  color:#EAF1F4;border-radius:99px;padding:8px 18px;font-size:20px;margin:0 7px 7px 0}
.wchip.new{border-color:#7FD3D8;background:rgba(127,211,216,.16);color:#BFF0F2}
.teamcard.done{background:rgba(127,211,216,.10);border-color:rgba(127,211,216,.5)}
.teamcard .state{font-size:26px;font-weight:700;margin-top:8px}
.teamcard .state.ok{color:#7FD3D8}
.teamcard .state.wait{color:#A8C0CC}
.scoreline{display:flex;gap:16px 34px;flex-wrap:wrap;margin-top:16px}
.scoreline .k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#A8C0CC}
.scoreline .v{font-size:44px;font-weight:700;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums}
.scoreline .v.best{color:#7FD3D8}
.gainline{margin-top:14px;font-size:17px;color:#C9DBE3}
.gainline b{color:#7FD3D8}
.projnote{margin-top:24px;font-family:Newsreader,Georgia,serif;font-size:20px;color:#C9DBE3;max-width:90ch}

.wdetail{background:rgba(255,255,255,.05);border:1px solid rgba(234,241,244,.18);border-radius:6px;padding:22px}
.wdetail .verdictw{font-family:Newsreader,Georgia,serif;font-size:22px;line-height:1.5;color:#EAF1F4;
  border-left:4px solid #EE9C6E;padding-left:20px;margin-bottom:22px;max-width:95ch}
.wtable{width:100%;border-collapse:collapse;font-size:19px}
.wtable th,.wtable td{padding:8px 12px;border-bottom:1px solid rgba(234,241,244,.14);white-space:nowrap}
.wtable th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A8C0CC;text-align:left;background:none}
.wtable td.obj{white-space:normal}
.wtable td.num,.wtable th.num{text-align:center;font-variant-numeric:tabular-nums}
.wtable td.off{color:#EE9C6E;font-weight:700}
.wtable td.coll{color:#7FD3D8;font-weight:700}
.wtable td.big{color:#F08C6A;font-weight:700}
.wtable tr.total td{border-bottom:none;font-weight:700;font-size:21px;padding-top:14px}
.rank{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}
.rankpill{background:rgba(255,255,255,.07);border:1px solid rgba(234,241,244,.2);border-radius:99px;
  padding:10px 20px;font-size:19px}
.rankpill b{color:#7FD3D8}

</style>
</head>
<body>
<div class="projwrap">
  <div class="projhead">
    <div>
      <p class="eyebrow">Yoda · Culture de l’ouverture</p>
      <h1>Perdus en mer</h1>
      <p class="phasetag" id="w-phase">—</p>
    </div>
    <div class="joinbox" id="w-join">
      <div class="qr" id="w-qr"></div>
      <div>
        <div class="lab">Code de session</div>
        <div class="code" id="w-code">—</div>
        <div class="url" id="w-url">—</div>
      </div>
    </div>
  </div>
  <div id="w-body"></div>
  <p class="projnote" id="w-note"></p>

</div>

      for (var i=0;i<rows.length;i++){
        var b = rows[i].getBoundingClientRect();
        if (ev.clientY < b.top + b.height/2){ target = i; break; }
        target = i;
      }
      if (target !== cur) self.move(cur, target);
    });
    function end(ev){
      if (!self.dragId) return;
      self.dragId = null;
      try{ el.releasePointerCapture(ev.pointerId); }catch(e){}
      self.render();
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    this.render();
  }

  /* ---------- Firestore ---------- */
  var db = null, dbError = "";
  function initDb(){
    if (db) return db;
    if (typeof firebase === "undefined" || !firebase.initializeApp){
      dbError = "La bibliothèque Firebase n’a pas pu être chargée. Vérifiez la connexion réseau puis rechargez la page.";
      return null;
    }
    try{
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(CFG);
      db = firebase.firestore();
      return db;
    }catch(e){
      dbError = "Connexion à la base impossible : " + (e && e.message ? e.message : e);
      return null;
    }
  }
  function sessionDoc(code){ return db.collection("sessions").doc(code); }
  function entriesCol(code){ return sessionDoc(code).collection("entries"); }
  function teamsCol(code){ return sessionDoc(code).collection("teams"); }

  /* ---------- calculs ---------- */
  function computeTeam(entries, teamDoc, team){
    var list = entries.filter(function(e){ return String(e.team) === String(team); })
      .map(function(e){ var o = decode(e.order);
        return o ? { name:e.name, order:o, score:scoreOf(o), id:e._id } : null; })
      .filter(Boolean)
      .sort(function(a,b){ return a.name.localeCompare(b.name, "fr"); });
    var t = teamDoc || {};
    var coll = t.collective ? decode(t.collective) : null;
    var r = { team:String(team), list:list, done: !!t.done, coll:coll,
              avg:null, best:null, bestName:"", gScore:null, gain:null };
    if (list.length){
      var sum=0, best=Infinity, bn="";
      list.forEach(function(v){ sum+=v.score; if (v.score<best){ best=v.score; bn=v.name; } });
      r.avg = sum/list.length; r.best = best; r.bestName = bn;
    }
    if (coll) r.gScore = scoreOf(coll);
    if (r.avg !== null && r.gScore !== null) r.gain = r.avg - r.gScore;
    return r;
  }

  function verdictText(r){
    if (r.gScore === null) return "";
    if (r.avg === null) return "Aucun classement individuel n’a été reçu pour cette table : le score est calculé, mais la comparaison qui fait la valeur de l’exercice n’est pas possible.";
    if (r.gScore < r.best) return "La table fait mieux que sa moyenne (" + fmt(r.avg) + " → " + r.gScore + ") et mieux que son meilleur membre (" + r.bestName + ", " + r.best + "). Le classement de la table n’appartient à personne : il a été produit par la discussion.";
    if (r.gScore < r.avg) return "La table fait mieux que sa moyenne (" + fmt(r.avg) + " → " + r.gScore + "), mais elle ne bat pas son meilleur membre (" + r.bestName + ", " + r.best + "). Question à poser : à quel moment cette personne a-t-elle renoncé à défendre son point de vue ?";
    return "La table fait moins bien que la moyenne de ses membres (" + fmt(r.avg) + " → " + r.gScore + "). C’est rare, et c’est le meilleur cas d’étude de la journée : la discussion a détruit de l’information au lieu d’en produire.";
  }

  function detailTable(r){
    if (!r.coll) return "";
    var html = '<table><thead><tr><th class="obj">Objet</th><th class="num">Officiel</th>';
    r.list.forEach(function(p){ html += '<th class="num">' + esc(p.name) + "</th>"; });
    html += '<th class="num">La table</th><th class="num">Écart</th></tr></thead><tbody>';
    ITEMS.slice().sort(function(a,b){ return a.off - b.off; }).forEach(function(it){
      var gi = r.coll.indexOf(it.id) + 1, gap = Math.abs(gi - it.off);
      html += '<tr><td class="obj">' + esc(it.n) + '</td><td class="num off">' + it.off + "</td>";
      r.list.forEach(function(p){ html += '<td class="num">' + (p.order.indexOf(it.id)+1) + "</td>"; });
      html += '<td class="num coll">' + gi + '</td><td class="num ' + (gap===0?"gap0":(gap<=2?"":"gap2")) + '">' + gap + "</td></tr>";
    });
    html += '<tr><td class="obj"><strong>Score total</strong></td><td class="num">—</td>';
    r.list.forEach(function(p){ html += '<td class="num"><strong>' + p.score + "</strong></td>"; });
    html += '<td class="num coll"><strong>' + r.gScore + '</strong></td><td class="num">—</td></tr></tbody></table>';
    return html;
  }

  function justifsHtml(){
    var h = "";
    ITEMS.slice().sort(function(a,b){ return a.off - b.off; }).forEach(function(it){
      h += '<div class="just"><div class="r">' + it.off + '</div><div class="o">' + esc(it.n) +
           '</div><div class="w">' + esc(it.w) + "</div></div>";
    });
    return h;
  }

  function drawQR(el, payload, cell){
    if (!el) return;
    if (typeof window.qrcode !== "function"){ el.innerHTML = ""; return; }
    try{
      var q = window.qrcode(0, "M");
      q.addData(payload); q.make();
      el.innerHTML = q.createSvgTag({cellSize: cell || 4, margin: 2, scalable: true});
    }catch(e){ el.innerHTML = ""; }
  }

  function ready(fn){
    function go(){ try{ fn(); }catch(err){ fail((err && err.message) || String(err)); } }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go, false);
    else go();
  }
  function fail(msg){
    try{
      var d = document.createElement("div");
      d.setAttribute("style","position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#A62B2B;color:#fff;font:13px/1.45 -apple-system,system-ui,sans-serif;padding:12px 16px");
      d.textContent = "Un problème technique empêche la page de fonctionner : " + msg;
      (document.body || document.documentElement).appendChild(d);
    }catch(e){}
  }
  window.addEventListener("error", function(e){ fail((e && e.message) || "erreur inconnue"); });

  return {
    ITEMS:ITEMS, BY_ID:BY_ID, IDS:IDS,
    decode:decode, scoreOf:scoreOf, fmt:fmt, esc:esc,
    save:save, load:load, qs:qs, baseUrl:baseUrl,
    Sorter:Sorter,
    initDb:initDb, get db(){ return db; }, get dbError(){ return dbError; },
    sessionDoc:sessionDoc, entriesCol:entriesCol, teamsCol:teamsCol,
    computeTeam:computeTeam, verdictText:verdictText, detailTable:detailTable,
    justifsHtml:justifsHtml, drawQR:drawQR, ready:ready
  };
})();

</script>
<script>
PEM.ready(function(){
  "use strict";

  var st = { code:(PEM.qs("s")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4),
             nteams:4, phase:"individuel", focus:"synthese",
             entries:[], teams:{}, seen:{} };

  var body = document.getElementById("w-body");
  var note = document.getElementById("w-note");

  if (!st.code){
    body.innerHTML = '<p class="projnote">Ouvrez cet écran depuis la page d’animation, ou ajoutez le code de session à l’adresse : mur.html?s=ABCD</p>';
    return;
  }
  if (!PEM.initDb()){
    body.innerHTML = '<p class="projnote">' + PEM.esc(PEM.dbError) + "</p>";
    return;
  }

  document.getElementById("w-code").textContent = st.code;
  var join = PEM.baseUrl() + "index.html?s=" + st.code;
  document.getElementById("w-url").textContent = join.replace(/^https?:\/\//, "");
  PEM.drawQR(document.getElementById("w-qr"), join, 4);

  PEM.sessionDoc(st.code).onSnapshot(function(s){
    var d = s.data() || {};
    st.nteams = d.nteams || st.nteams;
    st.phase = d.phase || "individuel";
    st.focus = d.focus || "synthese";
    render();
  }, function(){});
  PEM.entriesCol(st.code).onSnapshot(function(snap){
    var a = []; snap.forEach(function(d){ var v = d.data(); v._id = d.id; a.push(v); });
    st.entries = a; render();
  }, function(){});
  PEM.teamsCol(st.code).onSnapshot(function(snap){
    var m = {}; snap.forEach(function(d){ m[d.id] = d.data(); });
    st.teams = m; render();
  }, function(){});

  function teamsList(){
    var out = [];
    for (var i=1;i<=st.nteams;i++) out.push(PEM.computeTeam(st.entries, st.teams[String(i)], i));
    return out;
  }

  function card(cls){
    var d = document.createElement("div");
    d.className = "teamcard" + (cls ? " " + cls : "");
    return d;
  }
  function h3(t){ var h = document.createElement("h3"); h.textContent = t; return h; }
  function line(cls, t){ var d = document.createElement("div"); d.className = cls; d.textContent = t; return d; }

  function chips(parent, list){
    list.forEach(function(p){
      var s = document.createElement("span");
      s.className = "wchip" + (st.seen[p.id] ? "" : " new");
      s.textContent = p.name;
      st.seen[p.id] = 1;
      parent.appendChild(s);
    });
  }

  var lastSig = "";
  function render(){
    var sig = JSON.stringify([st.phase, st.focus, st.nteams,
      st.entries.map(function(e){ return [e._id, e.team, e.name, e.order]; }).sort(),
      st.teams]);
    if (sig === lastSig) return;
    lastSig = sig;
    var labels = { individuel:"Étape 1 — chacun classe seul",
                   equipe:"Étape 2 — la discussion par table",
                   resultats:"Étape 3 — les écarts" };
    document.getElementById("w-phase").textContent = labels[st.phase] || "";
    document.getElementById("w-join").classList.toggle("small", st.phase !== "individuel");

    body.innerHTML = "";
    var rows = teamsList();

    if (st.phase === "individuel"){
      var g = document.createElement("div"); g.className = "teamgrid";
      var total = 0;
      rows.forEach(function(r){
        total += r.list.length;
        var c = card();
        c.appendChild(h3("Table " + r.team));
        c.appendChild(line("count", r.list.length
          ? (r.list.length + " classement" + (r.list.length>1?"s":"") + " reçu" + (r.list.length>1?"s":""))
          : "en attente"));
        var box = document.createElement("div");
        chips(box, r.list);
        c.appendChild(box);
        g.appendChild(c);
      });
      body.appendChild(g);
      note.textContent = total
        ? "Rien du contenu des classements n’est affiché : la discussion doit avoir lieu avant."
        : "Scannez le carré, ou rendez-vous à l’adresse indiquée et saisissez le code.";
      return;
    }

    if (st.phase === "equipe"){
      var g2 = document.createElement("div"); g2.className = "teamgrid";
      var ready = 0;
      rows.forEach(function(r){
        if (r.done) ready++;
        var c = card(r.done ? "done" : "");
        c.appendChild(h3("Table " + r.team));
        c.appendChild(line("count", r.list.length + " participant" + (r.list.length>1?"s":"")));
        var box = document.createElement("div");
        chips(box, r.list);
        c.appendChild(box);
        c.appendChild(line("state " + (r.done ? "ok" : "wait"),
          r.done ? "Classement transmis" : (r.coll ? "Discussion en cours" : "Pas encore commencé")));
        g2.appendChild(c);
      });
      body.appendChild(g2);
      note.textContent = ready + " table" + (ready>1?"s ont":" a") + " transmis son classement sur " + rows.length +
        ". Le contenu reste caché jusqu’aux résultats.";
      return;
    }

    // ---------- résultats ----------
    if (st.focus === "synthese"){
      var g3 = document.createElement("div"); g3.className = "teamgrid";
      rows.forEach(function(r){
        var c = card(r.gScore !== null ? "done" : "");
        c.appendChild(h3("Table " + r.team));
        if (r.gScore === null){
          c.appendChild(line("state wait", "Pas de classement transmis"));
        } else {
          var sl = document.createElement("div"); sl.className = "scoreline";
          function blk(k, v, best){
            var d = document.createElement("div");
            var a = document.createElement("div"); a.className = "k"; a.textContent = k;
            var b = document.createElement("div"); b.className = "v" + (best ? " best" : ""); b.textContent = v;
            d.appendChild(a); d.appendChild(b); sl.appendChild(d);
          }
          if (r.avg !== null){ blk("Moyenne des individus", PEM.fmt(r.avg)); blk("Meilleur individu", String(r.best)); }
          blk("La table", String(r.gScore), r.avg === null || r.gScore < r.avg);
          c.appendChild(sl);
          if (r.gain !== null){
            var gl = document.createElement("div"); gl.className = "gainline";
            if (r.gain > 0) gl.innerHTML = "La discussion a gagné <b>" + PEM.fmt(r.gain) + " points</b>.";
            else if (r.gain === 0) gl.textContent = "La discussion n’a rien changé.";
            else gl.textContent = "La discussion a coûté " + PEM.fmt(-r.gain) + " points.";
            c.appendChild(gl);
          }
        }
        g3.appendChild(c);
      });
      body.appendChild(g3);

      var scored = rows.filter(function(r){ return r.gain !== null; })
                       .sort(function(a,b){ return b.gain - a.gain; });
      if (scored.length > 1){
        var rk = document.createElement("div"); rk.className = "rank";
        scored.forEach(function(r){
          var p = document.createElement("div"); p.className = "rankpill";
          p.innerHTML = "Table " + r.team + " · <b>" + (r.gain > 0 ? "+" : "") + PEM.fmt(r.gain) + "</b>";
          rk.appendChild(p);
        });
        body.appendChild(rk);
        note.textContent = "Le gain, c’est ce que la discussion a ajouté à la moyenne des membres. Qu’ont fait les tables qui ont le plus progressé ?";
      } else {
        note.textContent = "Un score bas vaut mieux qu’un score élevé : c’est l’écart avec le classement officiel des garde-côtes.";
      }
      return;
    }

    // détail d'une table
    var r2 = PEM.computeTeam(st.entries, st.teams[st.focus], st.focus);
    var w = document.createElement("div"); w.className = "wdetail";
    var t = document.createElement("h3");
    t.style.color = "#EE9C6E"; t.style.fontSize = "15px"; t.style.letterSpacing = ".14em";
    t.textContent = "Table " + st.focus;
    w.appendChild(t);
    if (!r2.coll){
      w.appendChild(line("state wait", "Cette table n’a pas transmis de classement."));
      body.appendChild(w); note.textContent = ""; return;
    }
    var v = document.createElement("div"); v.className = "verdictw";
    v.textContent = PEM.verdictText(r2);
    w.appendChild(v);

    var html = '<table class="wtable"><thead><tr><th class="obj">Objet</th><th class="num">Officiel</th>';
    r2.list.forEach(function(p){ html += '<th class="num">' + PEM.esc(p.name) + "</th>"; });
    html += '<th class="num">La table</th><th class="num">Écart</th></tr></thead><tbody>';
    PEM.ITEMS.slice().sort(function(a,b){ return a.off - b.off; }).forEach(function(it){
      var gi = r2.coll.indexOf(it.id) + 1, gap = Math.abs(gi - it.off);
      html += '<tr><td class="obj">' + PEM.esc(it.n) + '</td><td class="num off">' + it.off + "</td>";
      r2.list.forEach(function(p){ html += '<td class="num">' + (p.order.indexOf(it.id)+1) + "</td>"; });
      html += '<td class="num coll">' + gi + '</td><td class="num' + (gap > 2 ? " big" : "") + '">' + gap + "</td></tr>";
    });
    html += '<tr class="total"><td class="obj">Score total</td><td class="num">—</td>';
    r2.list.forEach(function(p){ html += '<td class="num">' + p.score + "</td>"; });
    html += '<td class="num coll">' + r2.gScore + '</td><td class="num">—</td></tr></tbody></table>';
    var wrap = document.createElement("div");
    wrap.style.overflowX = "auto";
    wrap.innerHTML = html;
    w.appendChild(wrap);
    body.appendChild(w);
    note.textContent = "Les écarts supérieurs à deux rangs sont en orange : ce sont les objets sur lesquels la table s’est trompée le plus.";
  }
});

</script>
</body>
</html>
